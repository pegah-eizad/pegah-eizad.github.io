---
layout: default
---

<script>
  $(document).ready(function() {
    $("#typewriteText").typewrite({
      actions: [{ type: "{{site.typewrite-text}}" }]
    });
  });
</script>

<div class="hero-section">
  <div class="hero-text">
    <h1 class="hero-name">{{ site.author }}</h1>
    <p class="hero-tagline" id="typewriteText"></p>
    <p class="hero-bio">{{ site.author_bio }}</p>
  </div>
  <div class="hero-photo">
    <img class="author-profile-img" src="/assets/img/profile.jpg" alt="{{ site.author }}" />
  </div>
</div>

<div class="home-content-area">
  <section class="posts-section">
    <h2 class="section-label">Writing</h2>
    <ul class="article-list">
      {% for post in site.posts limit:5 %}
      <li class="article-item">
        <a href="{{post.url}}" class="article-item-link">
          <span class="article-item-title">{{post.title}}</span>
          <span class="article-item-meta">
            <time datetime="{{ post.date }}" itemprop="datePublished">{{ post.date | date: "%b %-d, %Y" }}</time>
            {% for cat in post.category limit:1 %}
            <span class="article-tag">{{cat}}</span>
            {% endfor %}
          </span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </section>
</div>
